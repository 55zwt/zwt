<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>13-4 · 固定底部导航（SVG 图标）</title>
    <style>
        :root { color-scheme: light; --bg: #f3f5f9; --text: #202b3c; --muted: #718096; --accent: #536dfb; --danger: #f04452; }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            padding: 30px 20px calc(112px + env(safe-area-inset-bottom));
            color: var(--text);
            background: radial-gradient(circle at 85% 5%, rgba(83, 109, 251, .12), transparent 30%), var(--bg);
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }
        .page { width: min(760px, 100%); margin: 0 auto; }
        .eyebrow { margin: 0 0 10px; color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .16em; }
        h1 { margin: 0; font-size: clamp(26px, 6vw, 42px); }
        .intro { max-width: 560px; margin: 12px 0 28px; color: var(--muted); line-height: 1.8; }
        .demo { padding: clamp(20px, 5vw, 34px); border: 1px solid #e0e5ef; border-radius: 22px; background: rgba(255, 255, 255, .88); box-shadow: 0 18px 50px rgba(37, 52, 84, .08); }
        .demo h2 { margin: 0 0 8px; font-size: 19px; }
        .demo p { margin: 0; color: var(--muted); line-height: 1.8; }
        .steps { display: grid; gap: 10px; margin: 22px 0 0; padding: 0; list-style: none; }
        .steps li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: #f5f7fc; color: #526176; font-size: 13px; }
        .step-no { display: grid; width: 26px; height: 26px; flex: 0 0 26px; place-items: center; border-radius: 9px; background: #e8ecff; color: var(--accent); font-size: 12px; font-weight: 700; }
        .bottom-nav {
            position: fixed;
            z-index: 10;
            right: 0;
            bottom: 0;
            left: 0;
            display: flex;
            width: 100%;
            padding: 9px 8px calc(9px + env(safe-area-inset-bottom));
            border-top: 1px solid #e8ebf1;
            background: rgba(255, 255, 255, .96);
            box-shadow: 0 -10px 30px rgba(37, 52, 84, .09);
            backdrop-filter: blur(18px);
        }
        .nav-item {
            position: relative;
            display: flex;
            min-width: 0;
            min-height: 58px;
            flex: 1 1 25%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            color: #8792a4;
            font-size: 11px;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }
        .nav-item svg { width: 21px; height: 21px; stroke: currentColor; }
        .nav-item[aria-current="page"] { color: var(--accent); }
        .nav-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; border-radius: 12px; }
        .icon-wrap { position: relative; display: inline-flex; }
        .badge { position: absolute; top: -8px; right: -13px; display: grid; min-width: 17px; height: 17px; place-items: center; padding: 0 5px; border: 2px solid #fff; border-radius: 999px; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; line-height: 1; }
        .dot { position: absolute; top: -3px; right: -7px; width: 8px; height: 8px; border: 2px solid #fff; border-radius: 50%; background: var(--danger); }
        @media (max-width: 380px) {
            body { padding-right: 14px; padding-left: 14px; }
            .bottom-nav { padding-right: 2px; padding-left: 2px; }
            .nav-item { font-size: 10px; }
        }
    </style>
</head>
<body id="home">
    <main class="page">
        <p class="eyebrow">13-4 / INLINE SVG</p>
        <h1>SVG 底部导航</h1>
        <p class="intro">使用内联 SVG 绘制图标，不需要额外字体或在线资源。导航栏固定在底部并铺满屏幕，四个项目会随屏幕宽度平均伸缩。</p>
        <section class="demo" aria-labelledby="demo-title">
            <h2 id="demo-title">轻量的 SVG 图标</h2>
            <p>图标直接写在 HTML 中，线条颜色继承导航文字颜色；数字徽章与红点通过相对定位放在图标右上角。</p>
            <ol class="steps">
                <li><span class="step-no">1</span>每个导航项使用相同的 flex 比例</li>
                <li><span class="step-no">2</span>图标外层设为定位容器以显示提示标记</li>
                <li><span class="step-no">3</span>底部留出安全区，避免遮挡手机手势区域</li>
            </ol>
        </section>
    </main>
    <nav class="bottom-nav" aria-label="主导航">
        <a class="nav-item" href="#home" aria-current="page">
            <span class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7"></path><path d="M5 9v11h14V9"></path><path d="M9 20v-6h6v6"></path></svg></span>
            <span>首页</span>
        </a>
        <a class="nav-item" href="#discover">
            <span class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m15.5 8.5-2.2 4.8-4.8 2.2 2.2-4.8 4.8-2.2Z"></path></svg><span class="dot" aria-label="有新内容"></span></span>
            <span>发现</span>
        </a>
        <a class="nav-item" href="#messages">
            <span class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z"></path></svg><span class="badge" aria-label="3 条未读消息">3</span></span>
            <span>消息</span>
        </a>
        <a class="nav-item" href="#profile">
            <span class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M5 21a7 7 0 0 1 14 0"></path></svg></span>
            <span>我的</span>
        </a>
    </nav>
</body>
</html>
