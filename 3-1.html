<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>524 zwt</title>
</head>
<body>
    <h2>HTML表单form</h2>
    <form action="https://huanqiu.com" name="y1">
        <p>
            用户名:<input type="text" name="username" >
        </p>
        <p>
            密码:<input type="password" name="password" >
        </p>
        <p>
            性别:<input type="radio" name="sex" value="m">男
            <input type="radio" name="sex" value="f">女
            <!--保密-->
            <input type="radio" name="sex" value="s">保密
        </p>
        <p>
            爱好:<input type="checkbox" name="hobby" value="1">篮球
            <input type="checkbox" name="hobby" value="2">足球
            <input type="checkbox" name="hobby" value="3">羽毛球
        </p>
        <!--籍贯-->
        <p>
           籍贯:<select name="native" id="">
                <option value="beijing">北京</option>
                <option value="shanghai">上海</option>
                <option value="guangzhou">广州</option>
            </select>
        </p>
        <p>
            个人简介:<textarea name="desc" id="" cols="30" rows="10"></textarea>
        </p>
        <!--出生日期-->
        <p>
            出生日期:<input type="date" name="birthday">
        </p>
        <!--多文件上传-->
        <p>
            多文件上传:<input type="file" name="file" multiple>
        </p>
        <!--按钮：普通按钮，提交按钮，重置按钮-->
        <p>
            <input type="button" value="普通按钮">
            <input type="submit" value="提交按钮">
            <input type="reset" value="重置按钮">
        </p>
    </form>
    <!--按钮button-->
    <button>表单外的按钮</button>   
</body>
</html>
