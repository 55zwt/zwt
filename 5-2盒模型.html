<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒子模型、框模型，box model</title>
    <style>
      #a{
        width: 400px;
        height: 400px;
        border: 1px solid #039;
        padding:50px 40px 30px 20px;
        margin: 40px auto;
      }
      #b{
       width: 400px;
        height: 400px;
        border: 1px dashed #039;
        margin: 50px auto 40px;
      
      }
      #c, #d{
        width: 400px;
        height: 400px;
        border: 3px dotted #039;
        margin: 50px auto 40px;
      }
        
    </style>
</head>
<body>
    <div id="a">524 zwt</div>
    <div id="b">524 zwt</div>
    <div id="c">524 zwt</div>
    <div id="d">524 zwt</div>

</body>
</html>
