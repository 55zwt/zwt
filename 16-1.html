<!DOCTYPE html>
<!--
    功能名称：JavaScript 数组主要方法
    作者：赵婉彤
    建立时间：2026-10-29
    使用大模型：GLM-5.3-Flash
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16-1 · JavaScript 数组主要方法</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #10151f;
            --line: #303d52;
            --text: #edf3fc;
            --muted: #96a5bb;
            --accent: #69d2c3;
            --orange: #ffb86b;
            --purple: #c39bff;
            --red: #ff7a90;
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            padding: 28px 20px 48px;
            color: var(--text);
            background: radial-gradient(ellipse at 88% 0%, rgba(195, 155, 255, .12), transparent 40%), var(--bg);
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }
        .page { width: min(1080px, 100%); margin: 0 auto; }
        .eyebrow { margin: 0 0 10px; color: var(--purple); font-size: 12px; font-weight: 700; letter-spacing: .16em; }
        h1 { margin: 0; font-size: clamp(26px, 6vw, 42px); }
        .intro { max-width: 660px; margin: 12px 0 28px; color: var(--muted); line-height: 1.8; }
        .panel {
            padding: clamp(20px, 5vw, 32px);
            border: 1px solid var(--line);
            border-radius: 22px;
            background: linear-gradient(145deg, rgba(34, 47, 66, .95), rgba(25, 34, 49, .92));
            box-shadow: 0 20px 60px rgba(0, 0, 0, .22);
            margin-bottom: 22px;
        }
        h2.sec { margin: 0 0 6px; font-size: 20px; }
        .sec-desc { margin: 0 0 18px; color: var(--muted); font-size: 13px; line-height: 1.7; }

        /* ===== 数组操作台 ===== */
        .boxes { display: flex; flex-wrap: wrap; gap: 10px; min-height: 86px; align-items: flex-end; margin-bottom: 8px; }
        .box { text-align: center; }
        .box .val {
            min-width: 64px; padding: 14px 12px;
            border: 1px solid rgba(195, 155, 255, .45); border-radius: 10px;
            background: rgba(195, 155, 255, .1);
            font: 700 20px/1 "Consolas", monospace;
            animation: pop .35s ease;
        }
        .box .idx { margin-top: 5px; color: var(--muted); font: 11px/1 "Consolas", monospace; }
        .box.new .val  { border-color: var(--accent); background: rgba(105, 210, 195, .16); color: var(--accent); }
        .box.hit .val  { border-color: var(--orange); background: rgba(255, 184, 107, .16); color: var(--orange); }
        .box.empty     { color: var(--muted); font-size: 13px; padding-bottom: 30px; }
        @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .ctrl { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 4px; }
        .ctrl input {
            width: 84px; padding: 9px 10px;
            border: 1px solid var(--line); border-radius: 8px;
            background: rgba(9, 13, 20, .8); color: var(--text);
            font: 14px "Consolas", monospace; text-align: center;
        }
        .ctrl input:focus { outline: 1px solid var(--purple); }
        .btn {
            padding: 9px 14px; cursor: pointer;
            border: 1px solid var(--line); border-radius: 8px;
            background: rgba(255, 255, 255, .06); color: var(--text);
            font: 13px "Microsoft YaHei", sans-serif;
            transition: border-color .15s, background .15s;
        }
        .btn:hover { border-color: var(--purple); background: rgba(195, 155, 255, .14); }
        .btn code { font: 12px "Consolas", monospace; color: var(--accent); }

        .ops { margin-top: 16px; padding: 12px 16px; border-left: 3px solid var(--purple); border-radius: 0 8px 8px 0; background: rgba(195, 155, 255, .07); }
        .ops .line { color: #d7e5f5; font: 13px/1.9 "Consolas", monospace; }
        .ops .line b { color: var(--orange); font-weight: 700; }

        /* ===== 流水线 ===== */
        .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
        .stage { text-align: center; }
        .stage .chips { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
        .chip {
            padding: 7px 9px; min-width: 36px; text-align: center;
            border: 1px solid rgba(150, 165, 187, .25); border-radius: 8px;
            background: rgba(255, 255, 255, .05); color: #d7e5f5;
            font: 13px/1 "Consolas", monospace;
        }
        .chip.gone { opacity: .32; text-decoration: line-through; }
        .chip.sum  { border-color: var(--accent); color: var(--accent); font-size: 15px; }
        .stage .name { margin-top: 8px; color: var(--muted); font-size: 12px; }
        .stage .name code { color: var(--accent); }
        .arrow { color: var(--muted); font-size: 22px; }

        /* ===== 方法卡片 ===== */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
        .card { padding: 18px; border: 1px solid rgba(150, 165, 187, .2); border-radius: 14px; background: rgba(255, 255, 255, .035); }
        .card h3 { margin: 0 0 12px; font-size: 16px; }
        .card h3 code { color: var(--accent); font-size: 15px; }
        .code-box {
            margin: 0 0 12px; padding: 12px 14px;
            border: 1px solid rgba(150, 165, 187, .16); border-radius: 10px;
            background: rgba(9, 13, 20, .8); color: #cfe0f2;
            font: 12px/1.7 "Consolas", monospace; white-space: pre-wrap;
        }
        .out { padding: 10px 14px; border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; background: rgba(105, 210, 195, .08); }
        .out .line { color: #d7e5f5; font: 13px/1.9 "Consolas", monospace; }
        .out .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 4px 0; }
        .out .lbl { color: var(--muted); font-size: 12px; margin-right: 2px; }
    </style>
</head>
<body>
    <main class="page">
        <p class="eyebrow">16-1 / ARRAY METHODS</p>
        <h1>JavaScript 数组主要方法</h1>
        <p class="intro">把数组想象成一排带编号的抽屉。下面的操作台可以真实地增、删、改、查——每点一个按钮，抽屉会实时变化；下方还有方法卡片和一条“数据流水线”。</p>

        <!-- 交互操作台 -->
        <section class="panel" aria-label="数组操作台">
            <h2 class="sec">交互操作台 · 增删改查</h2>
            <p class="sec-desc">在输入框填数值和下标（可留空，有默认值），点按钮试试。紫色抽屉是刚变的，橙色是查找命中。</p>
            <div class="boxes" id="boxes"></div>
            <div class="ctrl">
                <input type="number" id="val" placeholder="数值" value="66">
                <input type="number" id="pos" placeholder="下标" value="2">
                <button class="btn" data-op="push"><code>push</code> 尾部加</button>
                <button class="btn" data-op="pop"><code>pop</code> 尾部删</button>
                <button class="btn" data-op="unshift"><code>unshift</code> 头部加</button>
                <button class="btn" data-op="shift"><code>shift</code> 头部删</button>
                <button class="btn" data-op="insert"><code>splice</code> 指定位置插入</button>
                <button class="btn" data-op="del"><code>splice</code> 指定位置删除</button>
                <button class="btn" data-op="reverse"><code>reverse</code> 反转</button>
                <button class="btn" data-op="sort"><code>sort</code> 升序</button>
                <button class="btn" data-op="includes"><code>includes</code> 查找</button>
            </div>
            <div class="ops" id="ops"></div>
        </section>

        <!-- 数据流水线 -->
        <section class="panel" aria-label="流水线演示">
            <h2 class="sec">一条数据流水线 · map → filter → reduce</h2>
            <p class="sec-desc">三个最常用的加工方法串联：先把每个元素 ×2，再筛掉 ≤10 的，最后求总和。原始数组 [3, 8, 12, 5, 20]。</p>
            <div class="flow" id="flow"></div>
        </section>

        <!-- 方法卡片 -->
        <section class="grid" id="grid" aria-label="方法卡片"></section>
    </main>

    <script>
        // ================= 交互操作台 =================
        var arr = [10, 20, 30, 40, 50];
        var ops = [];
        var boxes = document.getElementById('boxes');
        var opsBox = document.getElementById('ops');

        function getVal(def) {
            var v = document.getElementById('val').value;
            return v === '' ? def : Number(v);
        }
        function getPos(def) {
            var p = Number(document.getElementById('pos').value);
            if (document.getElementById('pos').value === '' || isNaN(p)) p = def;
            return Math.max(0, Math.min(arr.length, p));
        }
        function record(label, ret, mark) {
            ops.unshift({ label: label, ret: ret, mark: mark, snapshot: arr.slice() });
            if (ops.length > 6) ops.pop();
            renderOps();
            renderBoxes(mark);
        }
        function renderBoxes(mark) {
            boxes.innerHTML = '';
            if (arr.length === 0) {
                boxes.innerHTML = '<div class="box empty">数组空了～ 用 push 加点东西吧</div>';
                return;
            }
            arr.forEach(function (v, i) {
                var b = document.createElement('div');
                b.className = 'box' + (v === mark ? ' new' : '');
                b.innerHTML = '<div class="val">' + v + '</div><div class="idx">' + i + '</div>';
                boxes.appendChild(b);
            });
        }
        function renderOps() {
            opsBox.innerHTML = '';
            ops.forEach(function (o) {
                var l = document.createElement('div');
                l.className = 'line';
                l.innerHTML = '<b>' + o.label + '</b> → 返回 ' + o.ret +
                    '　<span style="color:#96a5bb">数组变为 [' + o.snapshot.join(', ') + ']</span>';
                opsBox.appendChild(l);
            });
            if (ops.length === 0) opsBox.innerHTML = '<div class="line" style="color:#96a5bb">还没有操作，点上面任意按钮试试</div>';
        }
        renderBoxes();

        document.querySelectorAll('.btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var op = btn.dataset.op, v, p, r, removed;
                if (op === 'push')    { v = getVal(66); r = arr.push(v);    record('arr.push(' + v + ')', '新长度 ' + r, v); }
                if (op === 'unshift') { v = getVal(66); r = arr.unshift(v); record('arr.unshift(' + v + ')', '新长度 ' + r, v); }
                if (op === 'pop')     { r = arr.pop();  record('arr.pop()', '被删的 ' + r); }
                if (op === 'shift')   { r = arr.shift(); record('arr.shift()', '被删的 ' + r); }
                if (op === 'insert')  { v = getVal(66); p = getPos(2); arr.splice(p, 0, v); record('arr.splice(' + p + ', 0, ' + v + ')', '[]（纯插入）', v); }
                if (op === 'del')     { p = getPos(2); removed = arr.splice(p, 1); record('arr.splice(' + p + ', 1)', '[' + removed + ']'); }
                if (op === 'reverse') { arr.reverse(); record('arr.reverse()', '原数组被反转'); }
                if (op === 'sort')    { arr.sort(function (a, b) { return a - b; }); record('arr.sort(function(a,b){return a-b})', '按数字升序'); }
                if (op === 'includes'){ v = getVal(30); r = arr.includes(v); record('arr.includes(' + v + ')', r ? 'true（找到了）' : 'false（不存在）', r ? v : undefined); }
            });
        });

        // ================= 流水线 =================
        var flow = document.getElementById('flow');
        var src = [3, 8, 12, 5, 20];
        var mapped = src.map(function (x) { return x * 2; });
        var filtered = mapped.filter(function (x) { return x > 10; });
        var total = filtered.reduce(function (s, x) { return s + x; }, 0);

        function stage(name, chips, goneFrom) {
            var d = document.createElement('div');
            d.className = 'stage';
            var c = document.createElement('div');
            c.className = 'chips';
            chips.forEach(function (v, i) {
                var s = document.createElement('span');
                s.className = 'chip' + (goneFrom && goneFrom[i] ? ' gone' : '');
                s.textContent = v;
                c.appendChild(s);
            });
            var n = document.createElement('div');
            n.className = 'name';
            n.innerHTML = name;
            d.appendChild(c); d.appendChild(n);
            flow.appendChild(d);
        }
        var arrow = function () { var a = document.createElement('div'); a.className = 'arrow'; a.textContent = '→'; flow.appendChild(a); };

        stage('原始数组', src);
        arrow();
        stage('<code>map(x2)</code> 每个都翻倍', mapped);
        arrow();
        stage('<code>filter(&gt;10)</code> 淘汰小的', mapped, mapped.map(function (x) { return x <= 10; }));
        arrow();
        stage('<code>reduce</code> 求总和', ['16+24+40', total], null, total);
        flow.lastChild.querySelector('.chip:last-child').classList.add('sum');

        // ================= 方法卡片 =================
        var cards = [
            {
                title: 'map · 加工每个元素',
                code: "var nums = [1, 2, 3, 4];\nvar dbl = nums.map(function (x) {\n    return x * 10;\n});\n// 原数组不变 → [1,2,3,4]",
                html: function (out) { row(out, '结果', [10, 20, 30, 40]); row(out, '原数组', [1, 2, 3, 4]); }
            },
            {
                title: 'filter · 筛选合格元素',
                code: "var scores = [88, 45, 92, 60, 73];\nvar passed = scores.filter(function (s) {\n    return s >= 60;\n});",
                html: function (out) { row(out, '全队', [88, 45, 92, 60, 73], [45]); row(out, '及格', [88, 92, 60, 73]); }
            },
            {
                title: 'reduce · 汇总成一个值',
                code: "var nums = [5, 10, 15, 20];\nvar sum = nums.reduce(function (s, x) {\n    return s + x;\n}, 0);\n// 累加过程: 5 → 15 → 30 → 50",
                html: function (out) {
                    line(out, '累加过程：5 → 15 → 30 → <b style="color:#69d2c3">50</b>');
                }
            },
            {
                title: 'sort · 排序（有个坑！）',
                code: "var nums = [1, 10, 2, 20];\nnums.sort();                    // 默认按“字符串”排\nnums.sort(function (a, b) {\n    return a - b;               // 数字要写比较器\n});",
                html: function (out) { row(out, '默认排', ['1', '10', '2', '20']); row(out, '比较器', [1, 2, 10, 20]); }
            },
            {
                title: 'slice · 截取片段（不动原数组）',
                code: "var fruits = ['苹果', '香蕉', '橘子', '葡萄'];\nvar part = fruits.slice(1, 3);\n// 下标 1 到 3（不含 3）",
                html: function (out) { row(out, '截取', ['香蕉', '橘子']); row(out, '原数组', ['苹果', '香蕉', '橘子', '葡萄']); }
            },
            {
                title: 'join · 拼成字符串',
                code: "var fruits = ['苹果', '香蕉', '橘子'];\nvar txt = fruits.join(' - ');",
                html: function (out) { row(out, '', ['苹果', '香蕉', '橘子']); line(out, '→ <b style="color:#ffb86b">"苹果 - 香蕉 - 橘子"</b>'); }
            },
            {
                title: 'indexOf / includes · 查找',
                code: "var nums = [10, 20, 30];\nnums.indexOf(20);     // 下标，找不到 -1\nnums.includes(30);    // true / false",
                html: function (out) {
                    line(out, 'indexOf(20) → <b style="color:#69d2c3">1</b>');
                    line(out, 'indexOf(99) → <b style="color:#ff7a90">-1</b>');
                    line(out, 'includes(30) → <b style="color:#69d2c3">true</b>');
                }
            },
            {
                title: 'concat · 合并数组',
                code: "var a = [1, 2], b = [3, 4];\nvar c = a.concat(b);\n// a 和 b 都不变",
                html: function (out) { row(out, '合并后', [1, 2, 3, 4]); row(out, 'a 还是', [1, 2]); }
            }
        ];

        var grid = document.getElementById('grid');
        cards.forEach(function (c) {
            var card = document.createElement('article');
            card.className = 'card';
            card.innerHTML = '<h3><code>' + c.title + '</code></h3>';
            var pre = document.createElement('pre');
            pre.className = 'code-box';
            pre.textContent = c.code;
            var out = document.createElement('div');
            out.className = 'out';
            c.html(out);
            card.appendChild(pre);
            card.appendChild(out);
            grid.appendChild(card);
        });

        // 卡片内的小工具
        function row(out, label, chips, gone) {
            var r = document.createElement('div');
            r.className = 'row';
            if (label) {
                var s = document.createElement('span');
                s.className = 'lbl'; s.textContent = label;
                r.appendChild(s);
            }
            chips.forEach(function (v, i) {
                var sp = document.createElement('span');
                sp.className = 'chip' + (gone && gone[i] ? ' gone' : '');
                sp.textContent = v;
                r.appendChild(sp);
            });
            out.appendChild(r);
        }
        function line(out, html) {
            var d = document.createElement('div');
            d.className = 'line';
            d.innerHTML = html;
            out.appendChild(d);
        }
    </script>
</body>
</html>
