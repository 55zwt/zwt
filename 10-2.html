<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-2</title>
    <style>
        /* 基础重置与页面排版 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: #edf1ee;
            background-image:
                linear-gradient(rgba(39, 76, 63, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(39, 76, 63, 0.035) 1px, transparent 1px);
            background-size: 32px 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px 0;
        }

        /* 幻灯片容器 */
        .slideshow-container {
            width: min(820px, calc(100vw - 40px));
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.78);
            box-shadow: 0 26px 60px rgba(31, 57, 47, 0.16),
                0 5px 16px rgba(31, 57, 47, 0.08);
            overflow: hidden;
            position: relative;
        }

        /* 图片区域容器 */
        .slides-wrapper {
            width: 100%;
            aspect-ratio: 12 / 7;
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            background: #17231e;
        }

        .slides-track {
            display: flex;
            width: 400%;
            height: 100%;
            animation: slideLoop 9s infinite;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .slide {
            position: relative;
            flex: 0 0 25%;
            height: 100%;
        }

        @keyframes slideLoop {
            0%, 30% { transform: translateX(0); }
            33.333%, 63.333% { transform: translateX(-25%); }
            66.667%, 96.667% { transform: translateX(-50%); }
            100% { transform: translateX(-75%); }
        }

        /* 图片上的指定文字 */
        .footer-text {
            text-align: center;
            font-family: SimHei, 'Microsoft YaHei', sans-serif;
            font-size: 26px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0;
            padding: 14px 8px 4px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.95),
                0 0 5px rgba(0, 0, 0, 0.8);
        }

        @media (max-width: 480px) {
            .slideshow-container {
                padding: 7px;
                border-radius: 13px;
            }

            .slides-wrapper {
                border-radius: 7px;
            }

            .footer-text {
                font-size: 23px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .slides-track {
                animation: none;
            }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- 幻灯片主体 -->
        <div class="slideshow-container">
            <div class="slides-wrapper">
                <div class="slides-track">
                    <div class="slide">
                        <img src="img/1.jpg" alt="幻灯片图片1">
                    </div>
                    <div class="slide">
                        <img src="img/2.jpg" alt="幻灯片图片2">
                    </div>
                    <div class="slide">
                        <img src="img/3.jpg" alt="幻灯片图片3">
                    </div>
                    <div class="slide" aria-hidden="true">
                        <img src="img/1.jpg" alt="">
                    </div>
                </div>
            </div>
            <div class="footer-text">524zwt</div>
        </div>
    </div>

</body>
</html>
