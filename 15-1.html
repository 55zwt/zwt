<!DOCTYPE html>
<!--
    功能名称：数7游戏
    作者：赵婉彤
    建立时间：2026-10-26
    使用大模型：GLM-5.3-Flash
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15-1 · 数7游戏</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #10151f;
            --line: #303d52;
            --text: #edf3fc;
            --muted: #96a5bb;
            --accent: #69d2c3;
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            padding: 28px 20px 48px;
            color: var(--text);
            background: radial-gradient(ellipse at 90% 0%, rgba(105, 210, 195, .14), transparent 38%), var(--bg);
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }
        .page { width: min(860px, 100%); margin: 0 auto; }
        .eyebrow { margin: 0 0 10px; color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .16em; }
        h1 { margin: 0; font-size: clamp(26px, 6vw, 42px); }
        .intro { max-width: 600px; margin: 12px 0 28px; color: var(--muted); line-height: 1.8; }
        .demo {
            padding: clamp(20px, 5vw, 34px);
            border: 1px solid var(--line);
            border-radius: 22px;
            background: linear-gradient(145deg, rgba(34, 47, 66, .95), rgba(25, 34, 49, .92));
            box-shadow: 0 20px 60px rgba(0, 0, 0, .22);
        }
        .rules { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 24px; }
        .rules span {
            padding: 8px 14px;
            border: 1px solid rgba(150, 165, 187, .18);
            border-radius: 999px;
            background: rgba(255, 255, 255, .035);
            color: #c5d1e2;
            font-size: 13px;
        }
        .rules .skip { border-color: rgba(105, 210, 195, .45); color: var(--accent); }
        /* 100 个盒子：10 列网格 */
        .boxes { display: grid; grid-template-columns: repeat(10, 1fr); gap: 10px; }
        .box {
            display: grid;
            aspect-ratio: 1 / 1;
            place-items: center;
            border: 1px solid rgba(150, 165, 187, .22);
            border-radius: 10px;
            background: rgba(255, 255, 255, .04);
            font-size: clamp(13px, 2.6vw, 17px);
            font-weight: 700;
            color: #e6eefa;
        }
        /* 满足数7要求的数字：空盒子（虚线边框表示“过”） */
        .box.pass {
            border: 1px dashed rgba(105, 210, 195, .55);
            background: rgba(105, 210, 195, .07);
        }
        @media (max-width: 640px) {
            .boxes { grid-template-columns: repeat(5, 1fr); }
        }
    </style>
</head>
<body>
    <main class="page">
        <p class="eyebrow">15-1 / 数 7</p>
        <h1>数7游戏</h1>
        <p class="intro">从 1 数到 100：遇到 7 的倍数、个位是 7 或十位是 7 的数字要喊“过”。满足要求的显示空盒子，其余数字正常显示。</p>
        <section class="demo" aria-label="100 个盒子">
            <div class="rules">
                <span>7 的倍数：7、14、21 …</span>
                <span>个位是 7：7、17、27 …</span>
                <span>十位是 7：70 ~ 79</span>
                <span class="skip">以上数字 → 空盒子（过）</span>
            </div>
            <div class="boxes" id="boxes"></div>
        </section>
    </main>
    <script>
        // 生成 1~100 共 100 个盒子
        const boxes = document.getElementById('boxes');
        for (let n = 1; n <= 100; n++) {
            const box = document.createElement('div');
            box.className = 'box';
            // 数7规则：7 的倍数，或数字中含 7（个位 / 十位）
            if (n % 7 === 0 || n % 10 === 7 || Math.floor(n / 10) === 7) {
                box.classList.add('pass'); // 空盒子
            } else {
                box.textContent = n;       // 正常显示数字
            }
            boxes.appendChild(box);
        }
    </script>
</body>
</html>
