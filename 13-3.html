<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>13-3 · 固定底部导航（字体图标）</title>
    <link rel="stylesheet" href="cdn/fontawesome/css/all.min.css">
    <style>
        :root {
            color-scheme: dark;
            --bg: #10151f;
            --line: #303d52;
            --text: #edf3fc;
            --muted: #96a5bb;
            --accent: #69d2c3;
            --danger: #ff5d72;
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            padding: 28px 20px calc(112px + env(safe-area-inset-bottom));
            color: var(--text);
            background: radial-gradient(ellipse at 90% 0%, rgba(105, 210, 195, .14), transparent 38%), var(--bg);
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }
        .page { width: min(760px, 100%); margin: 0 auto; }
        .eyebrow { margin: 0 0 10px; color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .16em; }
        h1 { margin: 0; font-size: clamp(26px, 6vw, 42px); }
        .intro { max-width: 560px; margin: 12px 0 28px; color: var(--muted); line-height: 1.8; }
        .demo {
            padding: clamp(20px, 5vw, 34px);
            border: 1px solid var(--line);
            border-radius: 22px;
            background: linear-gradient(145deg, rgba(34, 47, 66, .95), rgba(25, 34, 49, .92));
            box-shadow: 0 20px 60px rgba(0, 0, 0, .22);
        }
        .demo h2 { margin: 0 0 8px; font-size: 19px; }
        .demo p { margin: 0; color: var(--muted); line-height: 1.8; }
        .sample { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 24px; }
        .sample span { padding: 18px 14px; border: 1px solid rgba(150, 165, 187, .16); border-radius: 14px; background: rgba(255, 255, 255, .035); color: #c5d1e2; font-size: 13px; }
        .bottom-nav {
            position: fixed;
            z-index: 10;
            right: 0;
            bottom: 0;
            left: 0;
            display: flex;
            width: 100%;
            padding: 9px 8px calc(9px + env(safe-area-inset-bottom));
            border-top: 1px solid rgba(150, 165, 187, .18);
            background: rgba(20, 28, 41, .96);
            box-shadow: 0 -10px 30px rgba(0, 0, 0, .2);
            backdrop-filter: blur(18px);
        }
        .nav-item {
            position: relative;
            display: flex;
            min-width: 0;
            min-height: 58px;
            flex: 1 1 25%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            color: #91a0b6;
            font-size: 11px;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }
        .nav-item i { font-size: 20px; line-height: 1; }
        .nav-item[aria-current="page"] { color: var(--accent); }
        .nav-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; border-radius: 12px; }
        .icon-wrap { position: relative; display: inline-flex; }
        .badge {
            position: absolute;
            top: -9px;
            right: -14px;
            display: grid;
            min-width: 17px;
            height: 17px;
            place-items: center;
            padding: 0 5px;
            border: 2px solid #141c29;
            border-radius: 999px;
            background: var(--danger);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            line-height: 1;
        }
        .dot { position: absolute; top: -3px; right: -7px; width: 8px; height: 8px; border: 2px solid #141c29; border-radius: 50%; background: var(--danger); }
        @media (max-width: 380px) {
            body { padding-right: 14px; padding-left: 14px; }
            .bottom-nav { padding-right: 2px; padding-left: 2px; }
            .nav-item { font-size: 10px; }
        }
    </style>
</head>
<body id="home">
    <main class="page">
        <p class="eyebrow">13-3 / FONT ICON</p>
        <h1>固定底部导航</h1>
        <p class="intro">使用本地 Font Awesome 字体图标制作移动端导航。导航栏固定在屏幕底部，宽度占满视口，四个项目平均分配空间。</p>
        <section class="demo" aria-labelledby="demo-title">
            <h2 id="demo-title">自适应的四项导航</h2>
            <p>消息项目显示数字徽章，发现项目显示未读红点。缩窄窗口时项目仍然等宽排列。</p>
            <div class="sample" aria-hidden="true">
                <span>position: fixed</span><span>width: 100%</span>
                <span>flex: 1 1 25%</span><span>safe-area-inset-bottom</span>
            </div>
        </section>
    </main>
    <nav class="bottom-nav" aria-label="主导航">
        <a class="nav-item" href="#home" aria-current="page">
            <span class="icon-wrap"><i class="fa-solid fa-house" aria-hidden="true"></i></span><span>首页</span>
        </a>
        <a class="nav-item" href="#discover">
            <span class="icon-wrap"><i class="fa-solid fa-compass" aria-hidden="true"></i><span class="dot" aria-label="有新内容"></span></span><span>发现</span>
        </a>
        <a class="nav-item" href="#messages">
            <span class="icon-wrap"><i class="fa-solid fa-message" aria-hidden="true"></i><span class="badge" aria-label="3 条未读消息">3</span></span><span>消息</span>
        </a>
        <a class="nav-item" href="#profile">
            <span class="icon-wrap"><i class="fa-solid fa-user" aria-hidden="true"></i></span><span>我的</span>
        </a>
    </nav>
</body>
</html>
