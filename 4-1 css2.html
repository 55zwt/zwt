<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2,h3,p{
            padding:0;
            margin:0;
        }
        #box{
            width: 480px;
            padding: 8px;
            border: 1px solid #ccc;
            font-size: 12px;
            margin: 20px;
           
        }
        #box h3{
            font-size: 16px;
            text-align: center;
            line-height: 33px;
            letter-spacing: 3px;
            color: #036;
        }
        #box p{
            line-height: 150%;
            color: #666;
            /*首行缩进2em*/
            text-indent: 2em;
            
        }
        #box a{
            color: #f11;
            text-decoration: none;
            /*加粗*/
            font-weight: bold;
        }
        .student-id{
            color: #06c;
            font-weight: bold;
        }
        .student-name{
            color: #222;
            font-weight: bold;
        }
        .difficulty{
            color: #f00;
            font-weight: bold;
        }
        .knowledge{
            border: 1px solid #800080;
            padding: 2px 4px;
        }
    </style>
</head>
<body>
    <h2>css进阶</h2>
    <div id="box">
        <h3>CSS那些事</h3>
        <p>
            学号：<span class="student-id">524</span>，姓名：<span class="student-name">赵婉彤</span>，班级：计算机24005，对于《高级网页网页设计》课程的难度认知为：<span class="difficulty">难</span>，
            这个例子对应的知识点是：<span class="knowledge">群组选择器、后代选择器、层叠与继承</span>。
            <a href="#">更多>></a>
        </p>
    </div>
</body>
</html>
