<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>524 zwt</title>
    <style>
        p{
            color: #94a;
            font-size: 50px;
        }
        h2{
            background-color: #000;
            color: #fff;
            padding: 10px 20px;
            display: inline-block;
        }
        /*标签选择器*/
        #box{
            width: 600px;
            height: 500px;
            background-color: #f1a5f5;
        }
        .box2{
            width: 300px;
            height: 300px;
            background-color: #8ecae6;
        }
        /*id选择器*/
        .n1{
            color: #a5d2f5;
        }
        .n2{
            color: #dc7414;
        }
        .n3{
            color: #d2f5a5;
        }
    </style>
</head>
<body>
    <h2>层叠样式表 CSS</h2>
    <div id="box">
        <p>CSS<span style="color: #fff;">选择器</span></p>
        <p><span class="n1">赵</span><span class="n2">婉</span><span class="n3">彤</span></p>
        <p>CSS属性</p>
    
      
    </div>
    <div class="box2"></div>
   
</body>
</html>
