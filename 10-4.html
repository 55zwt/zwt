<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>10-4 媒体查询布局</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			min-width: 320px;
			min-height: 100vh;
			margin: 0;
			background-color: #f1f2ec;
			background-image: radial-gradient(rgba(31, 61, 56, 0.1) 1px, transparent 1px);
			background-size: 18px 18px;
			color: #193c39;
			font-family: 'Microsoft YaHei', sans-serif;
		}

		.page {
			width: min(1120px, 100%);
			margin: 0 auto;
			padding: 48px 28px 56px;
		}

		.page-header {
			display: flex;
			align-items: end;
			justify-content: space-between;
			gap: 20px;
			margin-bottom: 28px;
			padding-bottom: 20px;
			border-bottom: 1px solid rgba(25, 60, 57, 0.22);
		}

		h1 {
			margin: 0;
			font-family: Georgia, 'Microsoft YaHei', serif;
			font-size: 4rem;
			font-weight: 700;
			line-height: 1;
		}

		.page-index {
			margin: 0 0 4px;
			color: #59736c;
			font-size: 0.8rem;
			font-weight: 700;
		}

		.box-grid {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 14px;
		}

		.box {
			display: flex;
			min-height: 150px;
			flex-direction: column;
			justify-content: space-between;
			aspect-ratio: 1.15 / 1;
			overflow: hidden;
			padding: 18px;
			border: 1px solid rgba(255, 255, 255, 0.28);
			border-radius: 6px;
			background-image: linear-gradient(135deg, transparent 68%, rgba(255, 255, 255, 0.12) 68%);
			box-shadow: 0 9px 20px rgba(31, 61, 56, 0.1);
			color: #fff;
		}

		.box:nth-child(1) { background-color: #c85f43; }
		.box:nth-child(2) { background-color: #287b72; }
		.box:nth-child(3) { background-color: #456da8; }
		.box:nth-child(4) { background-color: #bd9133; }
		.box:nth-child(5) { background-color: #86546e; }
		.box:nth-child(6) { background-color: #5d7281; }
		.box:nth-child(7) { background-color: #64834f; }
		.box:nth-child(8) { background-color: #a95746; }

		.box-number {
			font-family: Georgia, serif;
			font-size: 0.9rem;
			font-weight: 700;
		}

		@media (min-width: 641px) and (max-width: 960px) {
			.box-grid {
				grid-template-columns: repeat(3, minmax(0, 1fr));
			}
		}

		@media (min-width: 961px) {
			.box-grid {
				grid-template-columns: repeat(4, minmax(0, 1fr));
			}
		}

		@media (min-width: 320px) and (max-width: 640px) {
			.page {
				padding: 32px 20px 40px;
			}

			.box-grid {
				grid-template-columns: repeat(2, minmax(0, 1fr));
				gap: 12px;
			}

			.box {
				min-height: 132px;
				padding: 14px;
			}
		}
	</style>
</head>
<body>
	<main class="page">
		<header class="page-header">
			<h1>zwt</h1>
			<p class="page-index">10 / 04</p>
		</header>
		<section class="box-grid" aria-label="八个响应式盒子">
			<article class="box"><span class="box-number">01</span></article>
			<article class="box"><span class="box-number">02</span></article>
			<article class="box"><span class="box-number">03</span></article>
			<article class="box"><span class="box-number">04</span></article>
			<article class="box"><span class="box-number">05</span></article>
			<article class="box"><span class="box-number">06</span></article>
			<article class="box"><span class="box-number">07</span></article>
			<article class="box"><span class="box-number">08</span></article>
		</section>
	</main>
</body>
</html>
