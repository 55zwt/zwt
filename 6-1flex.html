<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .flex{
            /*容器*/
            display: flex;
            /*子元素在一行显示*/
            flex-wrap: wrap;
         
        }
        .flex li{
           /* float: left;*/
            width: 50%;
            line-height: 100px;
            border: 1px solid #333;
            list-style:none;
            text-align: center;
            flex-grow: 1;
           
        }
        </style>
        
        
</head>
<body>
    <h2>赵婉彤 flex</h2>
    <ul class="flex">
        <li>1</li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
    </ul>
</body>
</html>
